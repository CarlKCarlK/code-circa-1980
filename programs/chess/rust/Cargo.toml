[package]
name = "cisab-chess"
version = "0.1.0"
edition = "2021"
description = "Rust port of Carl Kadie's CISAB chess program (TRS-80 Level II BASIC, v14), move for move"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.126"

[profile.release]
opt-level = "s"
lto = true
